# Reproduces the local Windows product gate without live provider credentials.
name: verify

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm 11 via corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pnpm\store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Prepare environment file
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Setup workspace (venv, api deps, pnpm install, extension build)
        shell: pwsh
        run: ./scripts/setup.ps1

      - name: Install Playwright Chromium for packaged Extension E2E
        shell: pwsh
        run: pnpm --dir apps/extension exec playwright install chromium

      - name: Enforce frontend coverage thresholds
        shell: pwsh
        run: pnpm test:coverage

      - name: Run the full local repository gate
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: >
          winget install --id JRSoftware.InnoSetup --exact --source winget
          --silent --accept-package-agreements --accept-source-agreements
          --disable-interactivity

      - name: Build separate Chrome extension package
        shell: pwsh
        run: ./scripts/build-extension-package.ps1

      - name: Build self-contained Windows installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      - name: Smoke installed Windows application
        shell: pwsh
        run: ./scripts/test-windows-installer-package.ps1

      - name: Upload separate Chrome extension package
        uses: actions/upload-artifact@v4
        with:
          name: archresearch-chrome-extension-only-v2.2.9
          path: .artifacts/releases/archresearch-chrome-extension-only-v2.2.9.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ArchResearch-Windows-x64-Setup-v2.2.9
          path: .artifacts/releases/ArchResearch-Windows-x64-Setup-v2.2.9.exe
          if-no-files-found: error

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            apps/api/pytest*.xml
            apps/board/test-results
            apps/extension/test-results
          if-no-files-found: ignore
