# Web Edition verification gate. The public repository publishes only the
# separately loaded Chrome extension; the retired Windows installer is not
# built or uploaded by CI.
name: verify

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm 11 via corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pnpm\store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install Web Edition workspace
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/extension run build

      - name: Install Playwright Chromium for packaged Extension E2E
        shell: pwsh
        run: pnpm --dir apps/extension exec playwright install chromium

      - name: Enforce frontend coverage thresholds
        shell: pwsh
        run: pnpm test:coverage

      - name: Run the focused Web Edition gate
        shell: pwsh
        run: ./scripts/verify-web.ps1

      - name: Build separate Chrome extension package
        shell: pwsh
        run: ./scripts/build-extension-package.ps1

      - name: Upload separate Chrome extension package
        uses: actions/upload-artifact@v4
        with:
          name: archresearch-chrome-extension-only-v2.2.1
          path: .artifacts/releases/archresearch-chrome-extension-only-v2.2.1.zip
          if-no-files-found: error

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            apps/api/pytest*.xml
            apps/board/test-results
            apps/extension/test-results
          if-no-files-found: ignore
