<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchResearch Chrome 扩展</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">研究会话</p>
        <h1>ArchResearch Chrome 扩展</h1>
      </header>
      <section class="status-grid" aria-label="连接状态">
        <div class="status-item">
          <span class="label">当前网页连接</span>
          <p class="value" data-role="connection">检查中</p>
        </div>
        <div class="status-item">
          <span class="label">网页读取权限</span>
          <p class="value" data-role="permission">检查中</p>
        </div>
      </section>
      <section class="permission-step" aria-label="当前操作">
        <p class="permission-guidance" data-role="permission-guidance" role="status">正在确认下一步…</p>
        <button class="primary-action" type="button" data-command="public.connect">连接当前 ArchResearch 网页</button>
        <button class="primary-action" type="button" data-command="permissions.request">允许网页读取</button>
        <button type="button" data-command="permissions.revoke">撤销网页读取权限</button>
      </section>
      <p class="error" data-role="error" role="alert"></p>
      <p class="boundary">只读取 ArchResearch 网页研究中需要的可见网页，不读取 Cookie、密码、浏览器存储或私信。授权会保留，直到你主动撤销或卸载扩展。</p>
    </main>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
