<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchResearch Bridge</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">浏览器连接</p>
        <h1>ArchResearch</h1>
      </header>
      <section class="status-grid" aria-label="连接状态">
        <div class="status-item">
          <span class="label">本地服务</span>
          <p class="value" data-role="connection">检查中</p>
        </div>
        <div class="status-item">
          <span class="label">研究权限</span>
          <p class="value" data-role="permission">检查中</p>
        </div>
      </section>
      <form data-role="pair-form">
        <label>
          本地服务地址
          <input data-role="endpoint" type="url" value="ws://127.0.0.1:8000/v1/browser" required>
        </label>
        <label>
          一次性配对码
          <input data-role="token" inputmode="numeric" autocomplete="one-time-code" required>
        </label>
        <button type="submit">手动配对</button>
      </form>
      <div class="actions">
        <button type="button" data-command="permissions.request">授予网页读取权限</button>
        <button type="button" data-command="permissions.revoke">撤销权限</button>
        <button class="wide" type="button" data-command="disconnect">断开连接</button>
      </div>
      <p class="error" data-role="error" role="alert"></p>
      <p class="boundary">临时网页读取权限只用于当前研究，任务结束后自动撤销。通常可直接在 ArchResearch 画板中一键连接。</p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
