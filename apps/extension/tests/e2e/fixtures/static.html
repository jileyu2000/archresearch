<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Courtyard Archive</title>
    <meta name="description" content="Adaptive reuse study with a section drawing.">
    <meta property="og:site_name" content="Fixture Architecture Review">
    <link rel="canonical" href="https://fixture.example/projects/courtyard-archive">
    <style>
      body { margin: 0; font-family: sans-serif; }
      main { padding: 32px; }
      figure { margin: 0; width: 640px; }
      figure img { display: block; width: 640px; height: 360px; }
      .small { width: 64px; height: 64px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Courtyard Archive reuse strategy</h1>
      <p>The public stair is inserted without erasing the retained shell.</p>
      <figure>
        <img src="/assets/section.svg" alt="Longitudinal section">
        <figcaption>Section through the retained shell and new public stair.</figcaption>
      </figure>
      <img class="small" src="/assets/logo.svg" alt="Publisher logo">
      <form aria-label="Account sign in">
        <img class="hidden" src="/assets/private.svg" alt="Private upload">
      </form>
    </main>
  </body>
</html>
