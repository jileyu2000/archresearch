  <rect width="960" height="600" fill="#fff"/>
  <g stroke="#d5dad6" stroke-width="1">
    <path d="M90 90H870M90 190H870M90 290H870M90 390H870M90 490H870"/>
    <path d="M90 90V510M220 90V510M350 90V510M480 90V510M610 90V510M740 90V510M870 90V510"/>
